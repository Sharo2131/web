<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lara, Are You Happy?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ee609e 0%, #fff0f6 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: linear-gradient(135deg, rgba(255,170,200,0.22), rgba(255,210,225,0.12));
            padding: 50px 44px;
            border-radius: 18px;
            box-shadow: 0 18px 70px rgba(0, 0, 0, 0.55);
            max-width: 520px;
            z-index: 10;
            position: relative;
            animation: slideIn 0.8s ease-out;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,130,180,0.22);
            color: #fff;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #f14897;
            font-size: 2.2em;
            margin-bottom: 12px;
            letter-spacing: 0.6px;
            text-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .love-message {
            display: none;
            margin-top: 18px;
            text-align: center;
        }

        .love-message.show {
            display: block;
            animation: scaleIn 0.6s ease-out;
        }

        .love-phrase {
            font-size: 2.1em;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .buttons-container {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-top: 28px;
            position: relative;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .yes-btn {
            background: linear-gradient(135deg, #ffd1e8, #ff9ecb);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 158, 203, 0.18);
        }

        .yes-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.6);
        }

        .yes-btn:active {
            transform: scale(0.98);
        }

        .no-btn {
            background: linear-gradient(135deg, rgba(255,192,203,0.06), rgba(255,240,245,0.03));
            color: #fff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            position: relative;
            border: 1px solid rgba(255,200,220,0.08);
        }

        .no-btn:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .success-message {
            display: none;
            text-align: center;
            margin-top: 20px;
            animation: scaleIn 0.6s ease-out;
            color: #ffd6e0;
        }

        .success-message.show {
            display: block;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(500px) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
                margin: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .buttons-container {
                flex-direction: column;
                gap: 15px;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>shera gyan choniii?</h1>

        <div class="love-message" id="loveMessage">
            <div class="love-phrase">good beatiful sher 🦁</div>
        </div>

        <div class="buttons-container">
            <button class="yes-btn" onclick="celebrateYes()">bashmmmm</button>
            <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">bashnim</button>
        </div>

        <div class="success-message" id="successMessage"></div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const randomX = (Math.random() - 0.5) * 300;
            const randomY = (Math.random() - 0.5) * 200;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function celebrateYes() {
            const buttons = document.querySelector('.buttons-container');
            buttons.style.display = 'none';

            const img = document.createElement('img');
            img.src = 'image/yes.jpeg';
            img.alt = 'After Yes';
            img.style.maxWidth = '100%';
            img.style.borderRadius = '12px';
            img.style.margin = '20px 0';

            const successMsg = document.getElementById('successMessage');
            const container = document.querySelector('.container');
            container.insertBefore(img, successMsg);

            successMsg.classList.add('show');

            const love = document.getElementById('loveMessage');
            if (love) love.classList.add('show');

            createConfetti();
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.innerHTML = ['🎉', '💖', '✨', '🎊', '💕'][Math.floor(Math.random() * 5)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.fontSize = (1 + Math.random() * 1.5) + 'em';
                confetti.style.animation = `confetti-fall ${2 + Math.random() * 1}s linear`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }
    </script>
</body>
</html>
